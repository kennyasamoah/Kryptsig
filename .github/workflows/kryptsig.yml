name: kryptsig

on:
  schedule:
    - cron: "*/15 * * * *"   # one cron; the script picks FULL vs HOT
  workflow_dispatch:
    inputs:
      mode:
        description: "run = poll | selftest = check dependencies | audit = check one token"
        type: choice
        default: run
        options: [run, selftest, audit, pond, log]
      address:
        description: "Token address (audit and log modes)"
        type: string
        required: false
      field:
        description: "log mode: would_i_buy | entry_mcap | outcome_24h | outcome_72h | note"
        type: string
        required: false
      value:
        description: "log mode: the value to record"
        type: string
        required: false
      note:
        description: "log mode: optional free text"
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: kryptsig
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Selftest
        if: inputs.mode == 'selftest'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CG_API_KEY: ${{ secrets.CG_API_KEY }}
        run: python kryptsig.py --selftest

      - name: Journal entry
        if: inputs.mode == 'log'
        run: |
          if [ -z "${{ inputs.address }}" ] || [ -z "${{ inputs.field }}" ]; then
            echo "log mode needs address and field"
            exit 1
          fi
          python kryptsig.py --log "${{ inputs.address }}" \
            "${{ inputs.field }}" "${{ inputs.value }}" "${{ inputs.note }}"

      - name: Show pond
        if: inputs.mode == 'pond'
        run: python kryptsig.py --pond

      - name: Audit token
        if: inputs.mode == 'audit'
        env:
          RUGCHECK_API_KEY: ${{ secrets.RUGCHECK_API_KEY }}
          CG_API_KEY: ${{ secrets.CG_API_KEY }}
        run: |
          if [ -z "${{ inputs.address }}" ]; then
            echo "No address supplied. Re-run and paste a token address."
            exit 1
          fi
          python kryptsig.py --audit "${{ inputs.address }}"

      - name: Poll and evaluate
        if: inputs.mode == '' || inputs.mode == 'run'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CG_API_KEY: ${{ secrets.CG_API_KEY }}
        run: python kryptsig.py

      - name: Persist state and logs
        if: always() && (inputs.mode == '' || inputs.mode == 'run' || inputs.mode == 'log')
        run: |
          set -e
          git config user.name  "kryptsig"
          git config user.email "actions@github.com"

          # NOTE: `git add a b c` fails and stages NOTHING if any path is
          # missing. On the first run observations.csv and alerts.csv do not
          # exist yet, so listing them by name silently staged nothing.
          git add -A

          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi

          git commit -m "poll $(date -u +%FT%TZ)"

          pushed=0
          for i in 1 2 3; do
            if git pull --rebase --autostash && git push; then
              pushed=1
              break
            fi
            echo "push attempt $i failed, retrying"
            sleep 5
          done

          if [ "$pushed" -ne 1 ]; then
            echo "PUSH FAILED after 3 attempts -- state was NOT saved"
            exit 1
          fi
          echo "state persisted"
