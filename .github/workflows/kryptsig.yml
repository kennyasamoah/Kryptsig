name: kryptsig

on:
  schedule:
    - cron: "7 * * * *"      # hourly, offset off the hour to dodge peak scheduling
  workflow_dispatch:
    inputs:
      mode:
        description: "run = normal poll | selftest = validate dependencies"
        type: choice
        default: run
        options: [run, selftest]

permissions:
  contents: write

concurrency:
  group: kryptsig
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Selftest
        if: inputs.mode == 'selftest'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CG_API_KEY: ${{ secrets.CG_API_KEY }}
        run: python kryptsig.py --selftest

      - name: Poll and evaluate
        if: inputs.mode != 'selftest'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CG_API_KEY: ${{ secrets.CG_API_KEY }}
        run: python kryptsig.py

      - name: Persist state and logs
        if: always() && inputs.mode != 'selftest'
        run: |
          set -e
          git config user.name  "kryptsig"
          git config user.email "actions@github.com"

          # NOTE: `git add a b c` fails and stages NOTHING if any path is
          # missing. On the first run observations.csv and alerts.csv do not
          # exist yet, so listing them by name silently staged nothing.
          git add -A

          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi

          git commit -m "poll $(date -u +%FT%TZ)"

          pushed=0
          for i in 1 2 3; do
            if git pull --rebase --autostash && git push; then
              pushed=1
              break
            fi
            echo "push attempt $i failed, retrying"
            sleep 5
          done

          if [ "$pushed" -ne 1 ]; then
            echo "PUSH FAILED after 3 attempts -- state was NOT saved"
            exit 1
          fi
          echo "state persisted"
