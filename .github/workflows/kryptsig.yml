name: kryptsig

on:
  schedule:
    - cron: "*/30 * * * *"    # GitHub's scheduler drifts 5-20 min under load
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kryptsig
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Poll and evaluate
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python kryptsig.py

      - name: Persist state and logs
        run: |
          git config user.name  "kryptsig"
          git config user.email "actions@github.com"
          git add state.json observations.csv alerts.csv 2>/dev/null || true
          git diff --staged --quiet || git commit -m "poll $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && break
            sleep 5
          done
